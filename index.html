<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mochi's Story</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="carousel-container">

        <h1>Mochi's Story</h1>
        <p class="subtitle">Same images. Different story.</p>

        <div class="sequence-buttons">
            <button id="hungryBtn" class="active">Hungry Mochi</button>
            <button id="fullBtn">Full Mochi</button>
        </div>

        <h2 id="storyTitle">Hungry Mochi</h2>

        <div class="image-container">
            <img id="storyImage" src="images/ragdoll1.jpg" alt="Mochi the ragdoll cat">
        </div>

        <p id="imageCounter">1 / 3</p>

        <div class="controls">
            <button id="previousBtn">← Previous</button>
            <button id="nextBtn">Next →</button>
        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
